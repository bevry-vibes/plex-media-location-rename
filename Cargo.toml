[package]
name = "plex-media-location-rename"
version = "0.1.0"
edition = "2024"
description = "Rewrite moved media paths inside a Plex library database, without losing added dates."
license = "RPL-1.5"
repository = "https://github.com/bevry-vibes/plex-media-location-rename"
readme = "README.md"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
